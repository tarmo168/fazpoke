<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="Leaderboard, charts and session ledger for our poker nights">
  <meta property="og:title" content="Fazwazpoker">
  <meta property="og:description" content="Leaderboard, charts and session ledger for our poker nights">
  <meta property="og:url" content="https://tarmo168.github.io/fazpoke/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://tarmo168.github.io/fazpoke/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Fazwazpoker leaderboard">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fazwazpoker">
  <meta name="twitter:description" content="Leaderboard, charts and session ledger for our poker nights">
  <meta name="twitter:image" content="https://tarmo168.github.io/fazpoke/assets/og-image.png">
  <meta name="twitter:image:alt" content="Fazwazpoker leaderboard">
  <title>Fazwazpoker</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="top">
    <div class="shell bar">
      <a class="brand" href="#/">
        <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M18 3.2 32.8 18 18 32.8 3.2 18 Z" fill="none" stroke="currentColor" stroke-width="1.6"></path>
          <path d="M18 11.2 24.8 18 18 24.8 11.2 18 Z" fill="currentColor"></path>
        </svg>
        <span>
          <span class="brand-name">Fazwazpoker</span>
          <span class="brand-kicker">Private ledger</span>
        </span>
      </a>
      <div class="bar-end">
        <div class="bar-actions">
          <a class="line-share" data-share-line href="https://social-plugins.line.me/lineit/share?url=https%3A%2F%2Ftarmo168.github.io%2Ffazpoke%2F" target="_blank" rel="noopener noreferrer">Share to LINE</a>
          <button type="button" class="bar-btn" data-share-more hidden>Share…</button>
          <button type="button" class="bar-btn" data-invite-open>Who's in?</button>
        </div>
        <nav class="tabs" aria-label="Sections">
          <a href="#/board" data-nav="board">Board</a>
          <a href="#/charts" data-nav="charts">Charts</a>
          <a href="#/ledger" data-nav="ledger">Ledger</a>
          <a href="#/live" data-nav="live">Live board</a>
        </nav>
      </div>
    </div>
  </header>
  <main id="content" class="shell" tabindex="-1">
    <noscript>This ledger reads the data files with JavaScript.</noscript>
  </main>
  <footer class="shell site-foot">
    <p><strong>Fazwazpoker</strong></p>
    <p>A recorded break-even is 0 and stays on the board. A player with no recorded result is listed there without a rank. An unrecorded result stays blank and is left out of rankings, totals, and charts.</p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
